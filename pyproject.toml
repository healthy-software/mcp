[project]
name = "weather-time-mcp"
version = "0.1.0"
description = "FastMCP server for Open-Meteo weather and Time.now world time tools."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
weather-time-mcp = "weather_time_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
